# This is a Declarative Automation Bundle definition for databricks_telemetry.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_telemetry
  uuid: 39f01160-a42c-4925-9a6f-ba29f448e0ee

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: Medallion data catalog
  schema:
    description: Default pipeline schema
  bronze_schema:
    description: Bronze layer schema
  silver_schema:
    description: Silver layer schema
  gold_schema:
    description: Gold layer schema
  raw_json_path: 
    description: Raw JSON landing path

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405608811042444.4.azuredatabricks.net
    variables:
      catalog: dtbrtelemetrydev
      schema: ${workspace.current_user.short_name}
      bronze_schema: ${workspace.current_user.short_name}
      silver_schema: ${workspace.current_user.short_name}
      gold_schema: ${workspace.current_user.short_name}
      raw_json_path: /Volumes/dtbrtelemetrydev/raw/telemetry_json/incoming
  prod:
    mode: production
    git:
      branch: main
    workspace:
      host: https://adb-7405609764554064.4.azuredatabricks.net
      # CI deploys with a service principal, so keep bundle state outside a user's workspace folder.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dtbrtelemetryprod
      schema: prod
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      raw_json_path: /Volumes/dtbrtelemetryprod/raw/telemetry_json/incoming
    permissions:
      - user_name: solgas80@gmail.com
        level: CAN_MANAGE
      - service_principal_name: 00466b1a-37d9-4439-b1e4-7e5185c07e49
        level: CAN_MANAGE
