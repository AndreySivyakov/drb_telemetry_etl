# The main pipeline for databricks_telemetry

resources:
  pipelines:
    databricks_telemetry_etl:
      name: databricks_telemetry_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/databricks_telemetry_etl/transformations"

      libraries:
        - glob:
            include: ../src/databricks_telemetry_etl/transformations/**
      
      configuration:
       telemetry.catalog: ${var.catalog}
       telemetry.bronze_schema: ${var.bronze_schema}
       telemetry.silver_schema: ${var.silver_schema}
       telemetry.gold_schema: ${var.gold_schema}
       telemetry.raw_json_path: ${var.raw_json_path}
