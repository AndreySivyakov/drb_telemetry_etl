# The main pipeline for databricks_telemetry

resources:
  pipelines:
    databricks_telemetry_etl:
      name: databricks_telemetry_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/databricks_telemetry_etl/transformations"

      libraries:
        - glob:
            include: ../src/databricks_telemetry_etl/transformations/**
      
      configuration:
        telemetry.raw_json_path: ${var.raw_json_path}

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
